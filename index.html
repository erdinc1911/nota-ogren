<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nota Öğren</title>
<meta name="theme-color" content="#2b1d14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nota Öğren">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="top">
  <button class="brand" aria-label="Seviyelere dön">
    <svg viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="15" cy="29" rx="8" ry="6" transform="rotate(-22 15 29)" fill="#c8893f"/><path d="M22 27V5c4 2 8 4 9 9" fill="none" stroke="#e9d9bd" stroke-width="3" stroke-linecap="round"/></svg>
    <span><h1>Nota Öğren</h1><small>Sol anahtarı · adım adım</small></span>
  </button>
  <button id="settings-btn" class="icon-btn" aria-controls="settings">⚙ Ayarlar</button>
</header>

<main id="view" class="wrap"></main>

<aside id="settings" class="drawer" aria-label="Ayarlar">
  <div class="drawer-head"><h2>Ayarlar</h2><button id="settings-close" class="icon-btn" aria-label="Kapat">✕</button></div>
  <label class="check"><input type="checkbox" id="set-sound"> Ses açık</label>
  <label class="field-s">Ses algılama hassasiyeti
    <select id="set-sens">
      <option value="yuksek">Yüksek – kısık sesi de yakalar</option>
      <option value="normal">Normal – gürültülü ortam için</option>
    </select>
  </label>
  <label class="field-s">Solfej hassasiyeti
    <select id="set-tol">
      <option value="40">Kolay – ±40 sent</option>
      <option value="25">Orta – ±25 sent</option>
      <option value="15">Zor – ±15 sent</option>
    </select>
  </label>
  <label class="check"><input type="checkbox" id="set-oct"> Solfejde oktav fark etmesin</label>
  <button id="install-btn" class="primary-btn" hidden>⬇ Uygulamayı yükle (masaüstü simgesi)</button>
  <p id="install-help" class="note" hidden></p>
  <button id="unlock-all" class="ghost-btn">Bütün seviyeleri aç</button>
  <button id="reset-all" class="ghost-btn">İlerlemeyi sıfırla</button>
  <p class="note">İlerlemen yalnızca bu cihazdaki tarayıcıda saklanır. Sesle cevap için 🎤 düğmesine bas; ilk seferde mikrofon izni sorulur.</p>
</aside>

<script type="module" src="js/app.js"></script>
</body>
</html>
